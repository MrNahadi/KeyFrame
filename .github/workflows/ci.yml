name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Cache dataset v1.0
        uses: actions/cache@v4
        with:
          path: data
          key: dataset-v1.0-3fba7aa0c288ae1b

      - name: Download dataset (checksum verified)
        run: test -f data/raw/Reference_Data.csv || uv run python -m keyframe.download

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest
